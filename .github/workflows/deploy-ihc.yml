name: Deploy to IHC

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install SSH password helper
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass rsync

      - name: Add IHC host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p 22 p1073030.ftp.ihc.ru >> ~/.ssh/known_hosts

      - name: Deploy site to IHC
        env:
          SSHPASS: ${{ secrets.IHC_PASSWORD }}
        run: |
          sshpass -e rsync -az --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='README.txt' \
            --exclude='.well-known/' \
            -e "ssh -p 22" \
            ./ p1073030@p1073030.ftp.ihc.ru:/home/p1073030/www/tulrecept.ru/
