name: Deploy to IHC

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install SSH password helper
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass rsync

      - name: Add IHC host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p 22 p1073030.ftp.ihc.ru >> ~/.ssh/known_hosts

      - name: Prepare private form storage
        env:
          SSHPASS: ${{ secrets.IHC_PASSWORD }}
        run: |
          sshpass -e ssh -p 22 p1073030@p1073030.ftp.ihc.ru \
            'mkdir -p /home/p1073030/data/tulrecept-partner-leads && chmod 700 /home/p1073030/data/tulrecept-partner-leads'

      - name: Deploy site to IHC
        env:
          SSHPASS: ${{ secrets.IHC_PASSWORD }}
        run: |
          sshpass -e rsync -az --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='README.txt' \
            --exclude='.well-known/' \
            -e "ssh -p 22" \
            ./ p1073030@p1073030.ftp.ihc.ru:/home/p1073030/www/tulrecept.ru/

      - name: Configure secondary domain redirect
        env:
          SSHPASS: ${{ secrets.IHC_PASSWORD }}
        run: |
          sshpass -e ssh -p 22 p1073030@p1073030.ftp.ihc.ru '
            SECONDARY=/home/p1073030/www/xn--e1aaajjf7affijc0c8de.xn--p1ai
            if [ ! -d "$SECONDARY" ]; then
              echo "Secondary site directory not found"
              find /home/p1073030/www -mindepth 1 -maxdepth 1 -type d -printf "%f\n"
              exit 1
            fi
            printf "%s\n" \
              "Options -Indexes" \
              "" \
              "RewriteEngine On" \
              "RewriteRule ^\\.well-known/acme-challenge/ - [L]" \
              "RewriteRule ^ https://tulrecept.ru%{REQUEST_URI} [R=301,L,NE]" \
              > "$SECONDARY/.htaccess"
          '
